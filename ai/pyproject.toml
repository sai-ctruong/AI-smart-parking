[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking-ai"
version = "0.1.0"
description = "AI package for the Smart Parking Management System"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = [
    "Pillow>=11,<13",
]
train = [
    "Pillow>=11,<13",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]
vision = [
    "torch>=2.5,<3",
    "opencv-python-headless>=4.10,<5",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
